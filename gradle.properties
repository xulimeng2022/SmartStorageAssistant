# JVM 参数：增大内存
# 注意：不要在此处添加 -Dfile.encoding=UTF-8。
# 原因：项目路径含中文（智能收纳助手），若 Gradle daemon 强制 UTF-8、而 Java 17 测试 worker 按系统默认编码（GBK）读取 classpath，
# 中文路径会乱码导致单元测试 ClassNotFoundException；保持 daemon 与 worker 同为系统默认编码即可正常跑测试与构建。
org.gradle.jvmargs=-Xmx2048m
# 启用 AndroidX
android.useAndroidX=true
# Kotlin 官方代码风格
kotlin.code.style=official
# 仅生成当前模块自己的 R 类，加快构建
android.nonTransitiveRClass=true
# 统一使用 KSP1，保证 Room/Hilt 注解处理器兼容性
ksp.useKSP2=false

# 项目路径包含中文，AGP 默认会拒绝构建；按官方方式显式放行
android.overridePathCheck=true